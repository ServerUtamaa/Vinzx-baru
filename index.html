    <script>
      (function () {
        try {
          if (window.location && window.location.search && window.location.search.indexOf('_vinzx_u=') !== -1) {
            var cleaned = window.location.search
              .replace(/([?&])_vinzx_u=[^&]*(&?)/g, function (_m, p1, p2) {
                return p2 ? p1 : '';
              })
              .replace(/[?&]$/, '');
            window.history.replaceState(null, '', window.location.pathname + cleaned + (window.location.hash || ''));
          }
        } catch (e) {}

        window.__VINZX_MOUNTED__ = false;
        var recovering = false;

        window.__vinzxForceHardRecover = function (reason) {
          if (recovering) return;
          if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
          try {
            var now = Date.now();
            var lastTs = Number(sessionStorage.getItem('vinzx_boot_recover_ts') || '0');
            var count = Number(sessionStorage.getItem('vinzx_boot_recover_cnt') || '0');
            if (now - lastTs < 20000) return;
            if (now - lastTs < 120000 && count >= 2) return;
            sessionStorage.setItem('vinzx_boot_recover_ts', String(now));
            sessionStorage.setItem('vinzx_boot_recover_cnt', String((now - lastTs > 120000 ? 0 : count) + 1));
          } catch (e) {}

          recovering = true;

          var finishReload = function () {
            try {
              var sep = window.location.search ? '&' : '?';
              var cleanSearch = (window.location.search || '')
                .replace(/([?&])_vinzx_u=[^&]*/g, '')
                .replace(/^&/, '?');
              var target = window.location.pathname + cleanSearch + (cleanSearch ? '&' : '?') + '_vinzx_u=' + Date.now() + (window.location.hash || '');
              window.location.replace(target);
            } catch (e) {
              window.location.reload();
            }
          };

          var clearCachesPromise = Promise.resolve();
          try {
            if ('caches' in window) {
              clearCachesPromise = window.caches.keys().then(function (names) {
                return Promise.all(names.map(function (n) { return window.caches.delete(n); }));
              }).catch(function () {});
            }
          } catch (e) {}

          var refreshHtmlPromise = Promise.resolve();
          try {
            if (typeof fetch === 'function') {
              refreshHtmlPromise = Promise.all([
                fetch('/', { cache: 'reload' }).catch(function () {}),
                fetch('/index.html', { cache: 'reload' }).catch(function () {})
              ]);
            }
          } catch (e) {}

          Promise.all([clearCachesPromise, refreshHtmlPromise]).then(finishReload, finishReload);
        };

        window.addEventListener('error', function (ev) {
          var target = ev && ev.target;
          if (target && target.tagName === 'SCRIPT') {
            var src = target.src || '';
            if (src.indexOf('/assets/') !== -1 || src.indexOf('index.tsx') !== -1) {
              window.__vinzxForceHardRecover('script-load-error');
            }
          }
        }, true);

        setTimeout(function () {
          if (!window.__VINZX_MOUNTED__) {
            window.__vinzxForceHardRecover('boot-timeout');
          }
        }, 15000);
      })();
    </script>
